name: Generate contribution snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Nero1l
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#e8a4a0&color_dots=#eceaf4,#d7d6e8,#a9a6c0,#7b7aa6,#2f3560
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8a4a0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
